<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="나누기·백분율 역산·분수 비교·자료해석·집합 추론과 오답 복습을 위한 GSAT 단순암기">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GSAT 단순암기">
  <style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#171b24;--muted:#667080;--line:#dfe3e9;--line-strong:#aab2bd;--blue:#3f5af8;--good:#17875b;--bad:#c43843;--rounded:19px;--shadow:0 16px 55px rgba(30,41,64,.055)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100dvh;overscroll-behavior-y:contain}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #899dff;outline-offset:2px}
button:disabled{opacity:.36;cursor:not-allowed}
.app-shell{max-width:940px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) clamp(14px,4vw,38px) calc(42px + env(safe-area-inset-bottom));min-height:100dvh}
.boot{letter-spacing:.22em;font-weight:800;color:#87909e;text-align:center;padding:36vh 0;font-size:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:31px}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.logo-mark{width:36px;height:36px;border:2px solid var(--ink);border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:950;letter-spacing:-1px;background:#fff;box-shadow:3px 3px 0 #d5d9ff}
.logo-words{display:flex;flex-direction:column;line-height:1.1}
.logo-words strong{font-size:14px;letter-spacing:.12em}
.logo-words small{font-size:9px;color:#737b89;letter-spacing:.15em;margin-top:4px;font-weight:750}
.top-actions{display:flex;gap:7px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:white;color:#404856;display:grid;place-items:center;font-size:19px}
.icon-btn:active{transform:scale(.96)}
.tiny-pill{font-size:11px;color:#60697a;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-weight:700}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.17em;color:#687286;text-transform:uppercase}
.hero h1{font-size:clamp(33px,7vw,56px);letter-spacing:-.066em;line-height:1.13;margin:11px 0 14px;font-weight:850}
.hero p{font-size:14px;line-height:1.85;color:var(--muted);max-width:590px;margin:0 0 30px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:32px}
.stat{border:1px solid var(--line);border-radius:14px;padding:16px 15px;background:var(--paper)}
.stat b{display:block;font-size:clamp(24px,4.2vw,30px);letter-spacing:-.06em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:11px;color:#697384;font-weight:700}
.section-header{display:flex;justify-content:space-between;align-items:center;margin:12px 0 13px}
.section-header h2{font-size:17px;letter-spacing:-.03em;margin:0}
.section-header span{font-size:11px;color:#8a93a0;font-weight:700}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode-card{position:relative;text-align:left;border:1px solid var(--line);border-radius:19px;background:white;padding:21px;min-height:198px;display:flex;flex-direction:column;align-items:flex-start;box-shadow:var(--shadow);transition:transform .13s,border-color .13s,box-shadow .13s;overflow:hidden}
.mode-card:active{transform:scale(.986)}.mode-card:hover{border-color:#b0bbcf;box-shadow:0 10px 35px rgba(45,56,78,.09)}
.mode-index{display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:#eff1f5;color:#606878;border-radius:10px;font-weight:800;font-size:12px;margin-bottom:20px}
.mode-title{font-size:20px;font-weight:800;letter-spacing:-.04em}
.mode-sub{font-size:12px;color:#6c7584;line-height:1.7;max-width:330px;margin-top:7px}
.mode-art{position:absolute;right:15px;top:20px;color:#eaedf2;font-weight:900;letter-spacing:-.06em;font-size:39px;line-height:1;pointer-events:none}
.mode-foot{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:auto;padding-top:17px;font-size:10px;font-weight:800;color:#6d7580}
.play-arrow{width:27px;height:27px;border:1px solid #e7e9ee;display:grid;place-items:center;border-radius:8px;color:#212632;font-size:15px}
.footnote{font-size:11px;color:#9ba3ae;line-height:1.65;text-align:center;margin:29px auto 0}
.game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;border:0;padding:8px 0;background:transparent;font-weight:800;color:#667080;font-size:12px}
.game-caption{color:#7f8998;font-size:11px;white-space:nowrap;font-weight:700}
.game-banner{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 19px}
.game-banner h1{font-size:clamp(23px,5vw,32px);letter-spacing:-.05em;margin:6px 0 0;line-height:1.25}
.combo-chip{border:1px solid #d7dce5;border-radius:12px;background:#fff;padding:9px 13px;text-align:right;min-width:88px}
.combo-chip strong{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.combo-chip small{display:block;font-size:9px;letter-spacing:.1em;color:#8a93a1;font-weight:800}
.combo-chip.active{background:#181e32;color:#fff;border-color:#181e32}
.combo-chip.active small{color:#b2bde0}
.progress-track{height:5px;background:#e4e7ee;overflow:hidden;border-radius:100px;margin-bottom:12px}
.progress-fill{height:100%;background:#262c38;border-radius:100px;transition:width .3s ease}
.game-metrics{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:#7b8492;margin-bottom:22px;font-variant-numeric:tabular-nums}
.game-metrics b{color:#394152}
.question-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(19px,5vw,38px);box-shadow:var(--shadow);min-height:280px}
.question-label{font-size:11px;letter-spacing:.13em;font-weight:800;color:#808b9a;text-transform:uppercase}
.big-question{font-size:clamp(79px,23vw,132px);font-weight:850;line-height:1.15;text-align:center;letter-spacing:-.075em;padding:18px 0 12px;color:#161b28}
.fraction-question{display:flex;flex-direction:column;align-items:center;padding:15px 0 24px;min-height:162px}
.fraction-numer,.fraction-denom{font-size:clamp(62px,16vw,90px);font-weight:850;letter-spacing:-.075em;line-height:1.0;font-variant-numeric:tabular-nums}
.fraction-line{width:113px;height:5px;background:#111823;margin:9px 0 10px;border-radius:3px}
.question-instruction{text-align:center;color:#7a8391;font-size:12px;margin-bottom:18px}
.answer-form{display:flex;align-items:stretch;gap:9px;max-width:460px;margin:5px auto 0}
.answer-input{min-width:0;flex:1;border:2px solid #e1e5ec;border-radius:13px;background:#f9fafc;padding:15px 14px;font-size:25px;font-weight:800;color:#222a36;text-align:center;font-variant-numeric:tabular-nums}
.answer-input::placeholder{font-size:15px;color:#a0a8b4;letter-spacing:0}
.primary-btn{padding:13px 18px;background:#222935;color:#fff;border:1px solid #222935;border-radius:13px;font-size:14px;font-weight:800;white-space:nowrap}
.primary-btn:active{transform:scale(.98)}
.answer-suffix{font-weight:800;font-size:20px;align-self:center;color:#697384}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:500px;margin:0 auto}
.choice{border:1.5px solid #dce1e9;background:#fff;color:#29313f;padding:21px 12px;border-radius:14px;font-weight:800;font-variant-numeric:tabular-nums;font-size:23px;letter-spacing:-.035em;transition:transform .11s,background .11s,border-color .11s}
.choice:active{transform:scale(.975)}.choice:hover{border-color:#8c9bb6;background:#fafbfe}
.choice.correct{border-color:#17a46c;color:#13764c;background:#eafaf3}.choice.wrong{border-color:#db6570;color:#b33440;background:#fff2f3}
.feedback{margin-top:16px;min-height:22px;font-size:13px;font-weight:750;text-align:center;color:#667080;line-height:1.6}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.shortcut-note{text-align:center;color:#98a0ad;margin-top:13px;font-size:11px;line-height:1.5}
.shake{animation:shake .28s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-2px)}}
.table-instruction{background:white;border:1px solid #d6d9df;border-radius:13px;padding:13px 15px;margin-bottom:11px;font-size:12px;line-height:1.65;color:#3c4655}
.table-instruction strong{color:#171c25}
.table-question-title{font-size:13px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em}
.drop-zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.compare-panel{border:1px solid #d5dbe4;background:#fff;border-radius:14px;padding:13px;min-width:0}
.compare-panel-header{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-width:0}
.compare-label{background:#222935;color:white;border-radius:7px;display:grid;place-items:center;width:28px;height:28px;font-size:15px;font-weight:800;flex:0 0 28px}
.compare-description{font-size:11px;line-height:1.4;font-weight:750;letter-spacing:-.02em}
.slotstack{display:flex;flex-direction:column;gap:6px}
.drop-slot{border:1.5px dashed #bfc7d2;background:#fafbfc;border-radius:9px;min-height:49px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;color:#697484;transition:background .11s,border-color .11s}
.drop-slot .slot-role{font-size:10px;font-weight:700;line-height:1.3}
.drop-slot .slot-val{font-size:14px;min-height:16px;font-weight:850;line-height:1.2;color:#222e3c;font-variant-numeric:tabular-nums}
.drop-slot.filled{border-style:solid;background:#f0f8f4;border-color:#9bcfb8}.drop-slot.filled .slot-val{color:#156b4d}
.drop-slot.drop-active{border-color:#4f69f7;background:#ebeeff;box-shadow:0 0 0 3px #4c68fb1b}
.drop-slot.drop-error{border-color:#d04f58;background:#fff0f1}
.math-op{font-size:11px;text-align:center;font-weight:750;color:#7a8592;padding:1px}
.table-help{display:flex;align-items:center;justify-content:space-between;gap:9px;color:#6a7483;font-size:11px;margin:8px 0 9px;line-height:1.5}
.table-help .tag{border:1px solid #d9dfe8;border-radius:5px;padding:3px 6px;background:#fff;white-space:nowrap}
.table-viewport{height:clamp(234px,39dvh,375px);overflow:auto;position:relative;border:1.5px solid #1b1d22;background:#fff;border-radius:0;overscroll-behavior:contain;scrollbar-width:thin}
.gsat-table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:710px;min-width:710px;background:#fff;color:#161616;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;font-variant-numeric:tabular-nums;font-size:12px}
.gsat-table th,.gsat-table td{border-right:1px solid #222;border-bottom:1px solid #222;padding:10px 5px;text-align:center;background:#fff;white-space:nowrap;height:39px}
.gsat-table th{font-size:11px;font-weight:800;background:#fff;position:sticky;top:0;z-index:5}
.gsat-table tr:last-child td{border-bottom:0}.gsat-table th:last-child,.gsat-table td:last-child{border-right:0}
.gsat-table .company{position:sticky;left:0;width:112px;min-width:112px;z-index:3;font-weight:650;background:#fff}
.gsat-table .year{position:sticky;left:112px;width:54px;min-width:54px;z-index:3;background:#fff}
.gsat-table th.company,.gsat-table th.year{z-index:8}
.gsat-table td.numeric{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.gsat-table td.numeric:active{cursor:grabbing}
.gsat-table td.cell-picked{background:#e9edff !important;box-shadow:inset 0 0 0 2px #6f83f9}
.gsat-table td.muted-group{border-top:1.5px solid #111}
.table-legend{color:#858b96;font-size:10px;padding:7px 0 0}
.table-compare{display:flex;gap:8px;justify-content:center;margin:13px 0 0}
.table-compare button{flex:1;max-width:180px;padding:14px 5px;border:1.5px solid #ced4de;background:#fff;border-radius:10px;font-size:17px;font-weight:850;font-variant-numeric:tabular-nums}
.table-compare button:not(:disabled):active{transform:scale(.98)}
.table-feedback{font-size:12px;min-height:37px;margin:10px 0 0;text-align:center;line-height:1.6;font-weight:700;color:#5b6571}
.table-feedback.ok{color:var(--good)}.table-feedback.no{color:var(--bad)}
.drag-ghost{position:fixed;z-index:10001;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.12);border:1px solid #111c31;border-radius:9px;padding:13px 18px;font-size:18px;font-weight:850;box-shadow:0 15px 28px #10204d42,0 0 0 4px #e4eaff;background:#fff;color:#131a28;white-space:nowrap;will-change:left,top;user-select:none}
.table-spark{box-shadow:0 0 0 4px #e7edff}
.session-finish{border:1px solid var(--line);background:white;border-radius:22px;text-align:center;padding:43px 23px 33px;box-shadow:var(--shadow)}
.finish-kicker{letter-spacing:.16em;color:#7a8595;font-size:11px;font-weight:850}
.finish-percent{font-size:clamp(76px,17vw,126px);line-height:1.2;letter-spacing:-.095em;font-weight:850;font-variant-numeric:tabular-nums;margin:15px 0}
.finish-title{font-size:22px;font-weight:800;letter-spacing:-.035em;margin:0 0 23px}
.finish-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:570px;margin:0 auto 28px}
.finish-stat{background:#f7f8fa;border-radius:12px;padding:13px 3px}
.finish-stat b{font-size:23px;font-variant-numeric:tabular-nums}.finish-stat span{font-size:10px;color:#737d8e;display:block;margin-top:5px}
.finish-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.secondary-btn{padding:13px 18px;background:white;border:1px solid #cbd2dc;color:#293441;border-radius:13px;font-size:14px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(21,26,36,.42);z-index:2000;display:grid;place-items:center;padding:15px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:20px;padding:24px;max-width:440px;width:100%;box-shadow:0 22px 66px rgba(10,18,35,.16)}
.modal h2{font-size:22px;margin:0 0 9px;letter-spacing:-.045em}.modal p{color:#6f7989;font-size:13px;line-height:1.75;margin:0 0 16px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #eef0f4;font-size:13px;font-weight:700}
.setting-row select{border:1px solid #ccd2dc;background:white;color:#242d3c;border-radius:9px;padding:8px;max-width:178px;font-weight:750}
.setting-row input[type=checkbox]{accent-color:#28354b;width:18px;height:18px}
.modal-footer{display:flex;justify-content:flex-end;margin-top:19px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10000}
.celebration{position:fixed;left:50%;top:23%;transform:translate(-50%,-50%);z-index:10002;pointer-events:none;white-space:nowrap;font-weight:950;font-size:clamp(35px,9vw,73px);color:#182230;letter-spacing:-.07em;opacity:0;text-align:center;text-shadow:0 2px 0 #fff,0 8px 22px #ffffffba}
.celebration.show{animation:popcelebrate .73s cubic-bezier(.18,.8,.35,1)}
@keyframes popcelebrate{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}17%{opacity:1;transform:translate(-50%,-50%) scale(1.22) rotate(3deg)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-78%) scale(1.12)}}
.toast{position:fixed;z-index:10100;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#212a37;color:#fff;border-radius:12px;padding:11px 16px;font-weight:750;font-size:12px;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:580px){.app-shell{padding-left:14px;padding-right:14px}.hero h1{font-size:38px}.mode-grid{gap:9px}.mode-card{padding:17px;min-height:205px}.mode-title{font-size:17px}.mode-sub{font-size:11px}.mode-art{font-size:30px;right:12px}.mode-index{margin-bottom:19px}.stat{padding:13px 9px}.stat b{font-size:24px}.question-card{padding:20px 15px}.answer-form{gap:5px}.answer-input{font-size:23px;padding:12px 8px}.primary-btn{padding:12px}.compare-panel{padding:9px}.compare-description{font-size:10px}.compare-panel-header{align-items:flex-start}.drop-slot .slot-role{font-size:9px}.drop-slot .slot-val{font-size:13px}.drop-slot{padding:7px;min-height:51px}.table-viewport{height:34dvh;min-height:225px}.table-help{font-size:10px}.table-compare button{font-size:15px}}
@media(max-width:365px){.mode-art{display:none}.mode-card{min-height:190px}.mode-title{font-size:16px}.compare-description{font-size:9.5px}.drop-zone-grid{gap:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* v1.1: printable exam-sheet composition, based on the proportions of a PSAT handout.
   No copied exam text or tables are bundled. */
.exam-paper{max-width:830px;margin:0 auto;background:#fff;border:1px solid #cdd2da;border-radius:0;padding:clamp(20px,5.1vw,51px) clamp(19px,5.8vw,61px) clamp(35px,5.5vw,62px);box-shadow:0 9px 28px rgba(17,24,39,.025)}
.exam-paper-meta{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #dadada;padding-bottom:8px;margin-bottom:23px;font-size:10px;font-weight:700;color:#777;letter-spacing:.025em}
.exam-question{font-size:clamp(14px,2.5vw,16px);line-height:1.8;letter-spacing:-.025em;margin:0 0 12px;color:#151515}
.exam-question strong{font-weight:850}
.exam-bracket{white-space:nowrap;font-weight:750}
.exam-formula{font-size:12px;line-height:1.6;color:#51555d;margin:0 0 23px;border-left:2px solid #c9ced6;padding-left:11px}
.exam-paper .drop-zone-grid{gap:14px;margin-bottom:21px}
.exam-paper .compare-panel{border-color:#cbd0d8;border-radius:6px;box-shadow:none;padding:13px}
.exam-paper .compare-label{background:#252525;border-radius:3px}
.exam-paper .compare-description{font-size:12px;line-height:1.55}
.exam-paper .drop-slot{border-radius:4px;background:#fff;border-color:#b7bdc6}
.exam-paper .drop-slot.filled{background:#f1f6f2;border-color:#a8c5b4}
.exam-paper .drop-slot.drop-active{background:#eef1ff;border-color:#445bde}
.exam-paper .table-help{margin:8px 0 27px;color:#777}
.exam-paper .table-help .tag{border-color:#e0e0e0;border-radius:3px;color:#555}
.exam-table-wrap{width:100%;max-width:690px;margin:0 auto;padding:0}
.exam-table-title{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#111;text-align:center;font-size:clamp(13px,2.3vw,16px);line-height:1.6;font-weight:750;letter-spacing:-.035em;margin-bottom:1px}
.exam-table-unit{text-align:right;font-size:11px;color:#272727;margin-bottom:7px}
.exam-paper .table-viewport{height:auto;min-height:0;max-height:none;overflow-x:auto;overflow-y:hidden;border:0;border-radius:0;scrollbar-width:thin;overscroll-behavior-x:contain}
.exam-paper .gsat-table{border-collapse:collapse;table-layout:fixed;min-width:0;width:100%;font-size:12px;border:1px solid #252525}
.exam-paper .gsat-table th,.exam-paper .gsat-table td{border:1px solid #545454;padding:7px 6px;height:33px;font-weight:450;position:static;white-space:nowrap;background:#fff;text-align:center}
.exam-paper .gsat-table th{font-weight:750;background:#f6f6f6}
.exam-paper .gsat-table .label-cell{background:#fafafa;font-weight:650}
.exam-paper .gsat-table th small{display:block;font-size:9px;color:#333;font-weight:500}
.exam-paper .gsat-table .group-start>*{border-top:2px solid #333}
.exam-paper .gsat-table .total-row>*{background:#f5f5f5;font-weight:750}
.exam-paper .gsat-table tr:last-child>*{border-bottom:1px solid #545454}
.exam-paper .gsat-table tr>*:last-child{border-right:1px solid #545454}
.exam-paper .gsat-table td.numeric{touch-action:none}

  // Local-only monitoring; previous v1 storage key is retained for seamless migration.
  // Bank keeps exact question snapshots for deterministic replay, including table/logic modes.
  function questionIdentity(mode,q){
    if(q._wrongKey)return q._wrongKey;
    let signature;
    if(mode==='alphabet')signature=`${q.n}`;
    else if(mode==='fraction'||mode==='applied')signature=`${q.num}/${q.den}`;
    else if(mode==='divide')signature=`${q.dividend}/${q.divisor}`;
    else if(mode==='reversePercent')signature=`${q.percent}:${q.part}`;
    else if(mode==='fractionCompare')signature=`${q.a}/${q.b}|${q.c}/${q.d}`;
    else if(mode==='diagram')signature=q.correctKey;
    else if(mode==='reason')signature=JSON.stringify({t:q.task,p:q.premises,c:q.conclusion});
    else if(mode==='table')signature=`${q.kind}:`+JSON.stringify(q.rows)+JSON.stringify(q.options.map(o=>o.text));
    else signature=JSON.stringify(q);
    return `${mode}|${signature}`;
  }
  function questionLabel(mode,q){
    if(mode==='alphabet')return `${letter(q.n)} = ?`;
    if(mode==='fraction'||mode==='applied')return `${q.num}/${q.den} = ?%`;
    if(mode==='divide')return `${q.dividend} ÷ ${q.divisor} = ?`;
    if(mode==='reversePercent')return `${two(q.part)}은 전체의 ${q.percent}% · 전체는?`;
    if(mode==='fractionCompare')return `${q.a}/${q.b}  ?  ${q.c}/${q.d}`;
    if(mode==='diagram')return q.statement;
    if(mode==='reason')return `${q.task==='bridge'?'중간 명제':'결론'} · ${q.premises.map(reasonText).join(' ')}`;
    if(mode==='table')return `${q.preset.title} · ${q.numStatements}개 선지`;
    return modeRegistry.get(mode)?.title||mode;
  }
  function recordAnswer(mode,q,correct,elapsed){
    const stats=state.modeStats[mode]||{attempted:0,right:0,wrong:0,totalMs:0};
    stats.attempted++;stats.totalMs+=Math.max(0,elapsed);
    if(correct)stats.right++;else stats.wrong++;
    state.modeStats[mode]=stats;
    const key=questionIdentity(mode,q);
    const existing=state.wrongBank[key];
    if(correct){
      if(existing){
        existing.correctAfterWrong=(existing.correctAfterWrong||0)+1;
        existing.streak=(existing.streak||0)+1;
        if(existing.streak>=2)existing.mastered=true;
        existing.lastResult='correct';existing.updated=Date.now();
      }
    }else{
      // Never persist a recursive/DOM-containing object. Only plain data is saved.
      const copy=JSON.parse(JSON.stringify(q));delete copy._wrongKey;
      state.wrongBank[key]={...(existing||{}),id:key,mode,label:questionLabel(mode,q),question:copy,wrongCount:(existing?.wrongCount||0)+1,correctAfterWrong:existing?.correctAfterWrong||0,streak:0,mastered:false,lastResult:'wrong',updated:Date.now()};
    }
    const entries=Object.values(state.wrongBank);
    if(entries.length>125){
      entries.sort((a,b)=>Number(a.mastered)-Number(b.mastered)||a.updated-b.updated);
      for(const e of entries.slice(0,entries.length-125))delete state.wrongBank[e.id];
    }
  }
  function getWeakEntries(mode='all'){
    return Object.values(state.wrongBank).filter(e=>e && !e.mastered && modeRegistry.has(e.mode) && (mode==='all'||e.mode===mode)).sort((a,b)=>b.wrongCount-a.wrongCount||b.updated-a.updated);
  }
  function startWrongReview(mode='all'){
    const entries=getWeakEntries(mode);
    if(!entries.length){toast('복습할 오답이 없습니다.');return;}
    const queue=entries.slice(0,Math.max(1,state.settings.questionCount)).map(e=>({id:e.id,mode:e.mode,question:e.question}));
    startGame(queue[0].mode,queue);
  }

      <div class="stats-grid monitor-stats"><div class="stat"><b>${two(totalWrong)}</b><span>누적 오답 횟수</span></div><div class="stat"><b>${unresolved.length}</b><span>복습 대기 문제</span></div><div class="stat"><b>${mastered}</b><span>복습 완료 문제</span></div></div>
      <div class="monitor-toolbar"><button type="button" id="review-all" class="primary-btn" ${unresolved.length?'':'disabled'}>오답 집중 훈련 (${Math.min(unresolved.length,state.settings.questionCount)}문제) →</button><span class="monitor-help">틀린 문제를 그대로 다시 출제합니다.</span></div>
      <h2 class="monitor-heading">게임별 훈련 기록</h2>
      <div class="mode-stat-list">${modes.map(m=>{

      }).join('')}</div>
      <div class="monitor-list-head"><h2 class="monitor-heading">오답 목록</h2><label>유형 <select id="monitor-filter"><option value="all">전체</option>${modes.map(m=>`<option value="${escapeHtml(m.key)}">${escapeHtml(m.title)}</option>`).join('')}</select></label></div>
      <div id="monitor-items"></div>
      <div class="monitor-footer"><button class="secondary-btn" id="clear-weak">오답 기록만 초기화</button><p>기록을 초기화해도 누적 풀이 및 게임별 정답률은 유지됩니다. 브라우저 데이터 삭제 또는 기기 변경 시 기록은 이전되지 않습니다.</p></div>`;
    bindTopbar();
    $('#monitor-back').addEventListener('click',exitGame);

    const showList=()=>{
      const filter=$('#monitor-filter').value;
      const list=getWeakEntries(filter);
      $('#monitor-items').innerHTML=list.length?list.slice(0,60).map(e=>`<div class="wrong-list-item"><div><small>${escapeHtml(modeRegistry.get(e.mode)?.title||e.mode)} · ${new Date(e.updated).toLocaleDateString('ko-KR')}</small><strong>${escapeHtml(e.label)}</strong></div><span class="wrong-badge">오답 ${e.wrongCount}회 · 재정답 ${e.streak}/2</span></div>`).join(''):`<div class="monitor-empty">${filter==='all'?'복습 대기 중인 오답이 없습니다.':'이 유형에 복습할 오답이 없습니다.'}</div>`;
    };
    $('#monitor-filter').addEventListener('change',showList);showList();
    $('#clear-weak').addEventListener('click',()=>{
      if(!Object.keys(state.wrongBank).length){toast('저장된 오답 기록이 없습니다.');return;}

        state.wrongBank={};saveState();renderMonitor();
      }
    });
  }

  function startGame(key, reviewQueue=null){
    const mode=modeRegistry.get(key);if(!mode)return;
    monitoring=false;
    clearTimeout(pendingTimer);tableCleanup();tableCleanup=()=>{};

  function tone(ctx,freq,start,duration,kind='sine',volume=.06){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind;o.frequency.setValueAtTime(freq,start);

  function playSuccess(combo){

    const n=Math.min(6,2+Math.floor(combo/2));
    for(let i=0;i<n;i++){tone(ctx,scale[i],t+i*.075,.16+Math.min(combo,8)*.012,'sine',.058);tone(ctx,scale[i]*2,t+i*.075+.015,.065,'triangle',.013);}
    if(combo>=3){tone(ctx,196,t,.20,'triangle',.040);tone(ctx,1046.5,t+.28,.45,'sine',.030);}

  }

  function animateFx(){

  function makeFractionQuestion(applied,session){
    let den=applied?random(3,20):random(2,20);

    if(session.lastQuestionSignature===`${num}/${den}`){den=den===20?2:den+1;if(applied&&den<3)den=3;num=applied?Math.min(num,den-1):1;}
    session.lastQuestionSignature=`${num}/${den}`;
    const exact=percentage(num,den),answer=Number(exact.toFixed(2));
    const alternatives=new Set([answer.toFixed(2)]);
    const candidates=[percentage(num,den+1),percentage(num,Math.max(2,den-1)),percentage(Math.max(1,num-1),den),percentage(num+1,den),exact+5,exact-5,exact+2.5,exact-2.5,exact+10,exact-10];
    shuffle(candidates).forEach(v=>{if(alternatives.size>=4)return;const r=Number(Math.max(.01,Math.min(99.99,v)).toFixed(2));if(Math.abs(r-answer)>=.3)alternatives.add(r.toFixed(2));});

  function numericChoices(correct, count=4){
    const candidates=new Set([correct]);

  // 6. Compare rational values using exact integer cross products (no rounding errors).
  function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}
  registerMode({key:'fractionCompare',title:'분수 크기 비교',subtitle:'통분 없이 교차곱으로 어느 분수가 더 큰지 판단합니다.',tag:'FRACTION / COMPARE',art:'> <',
    makeQuestion({session}){
      let a,b,c,d,ans,signature,tries=0;
      const equalMode=Math.random()<.16;
      do{
        b=random(3,20);a=random(1,b-1);
        if(equalMode){
          const g=gcd(a,b),reducedA=a/g,reducedB=b/g;
          const possibilities=[];

  const FINANCE_NAMES=['가온전자','미르소재','하람바이오','새빛반도체'];

  const YEARS=[2022,2023,2024];
  const FINANCE_COLS=[{key:'revenue',label:'매출액'},{key:'operating',label:'영업이익'},{key:'net',label:'당기순이익'},{key:'assets',label:'총자산'}];
  const INDEX_COLS=[{key:'inventory',label:'재고지수'},{key:'shipment',label:'출하지수'}];

  const keyFor=(row,metric)=>`${row.company}|${row.year}|${metric}`;
  function generateFinance(){
    const rows=[],companyBaseline={};
    FINANCE_NAMES.forEach(c=>companyBaseline[c]={revenue:random(850,3000),om:random(105,235)/1000,nm:random(45,105)/1000,asset:random(2600,6000)});
    for(const company of FINANCE_NAMES){
      const b=companyBaseline[company];
      for(const year of YEARS){
        const trend=1+(year-2022)*random(-3,18)/100;
        const revenue=Math.round(b.revenue*trend*random(91,110)/100);
        const operating=Math.max(1,Math.round(revenue*(b.om+(year-2022)*random(-20,20)/1000)));
        const net=Math.max(1,Math.round(revenue*(b.nm+(year-2022)*random(-18,18)/1000)));
        const assets=Math.round(b.asset*(.88+(year-2022)*.052+random(1,22)/100));
        rows.push({company,year,revenue,operating,net,assets});

    }
    return rows;
  }
  function generateIndustry(){
    const rows=[];

      const inventoryBase=random(88,115),shipmentBase=random(91,118);
      for(const year of [2021,2022,2023,2024]){
        const inventory=Number((inventoryBase+random(-85,85)/10+(year-2021)*random(-12,18)/10).toFixed(1));
        const shipment=Number((shipmentBase+random(-75,75)/10+(year-2021)*random(-15,15)/10).toFixed(1));
        rows.push({company,year,inventory,shipment});
      }
    }
    return rows;
  }
  function generateMonthly(){
    const rows=[],baselines=Array.from({length:12},()=>random(8500,15000));

    }
    return rows;
  }
  function generateKindergarten(){
    const rows=[];

    for(let year=2018;year<=2024;year++){
      rows.push({company:'갑시',year,kindergartens:Math.round(base.kindergartens*(1-(year-2018)*.015)+random(-6,6)),children:Math.round(base.children*(1-(year-2018)*.035)+random(-360,360)),teachers:Math.round(base.teachers*(1+(year-2018)*.012)+random(-50,50))});

  const TABLE_MODES={

    monthly:{title:'2023년과 2024년의 월별 민원건수',unit:'건',cols:MONTH_COLS},
    kindergarten:{title:'2018~2024년 갑시의 유치원 현황',unit:'개, 명',cols:KINDER_COLS}

  function makeTableQuestion({state}){
    const kinds=Object.keys(TABLE_MODES);

    const preset=TABLE_MODES[chosen];
    const rows=chosen==='finance'?generateFinance():chosen==='industry'?generateIndustry():chosen==='monthly'?generateMonthly():generateKindergarten();

    const template=()=>{
      const r=pick(rows);

      if(chosen==='finance'){
        const ratio=pick([
          ['net','revenue',`매출액 대비 당기순이익 비율`],
          ['operating','revenue',`매출액 대비 영업이익 비율`],
          ['net','assets',`총자산 대비 당기순이익 비율`],
          ['operating','assets',`총자산 대비 영업이익 비율`]

        text=`${r.year}년 ${r.company}의 ${ratio[2]}`;
      }else if(chosen==='industry'){
        numerator='inventory';denominator='shipment';
        text=`${r.year}년 ${r.company}산업군의 재고율`;
      }else if(chosen==='monthly'){
        const otherYear=r.year===2024?2023:2024;

        numerator='complaints';denominator='complaints';
        text=`${r.company} 민원건수의 ${r.year}년 수치가 ${otherYear}년 수치에서 차지하는 비율`;
        return {text,numRow:r,denRow:base,numerator,denominator};
      }else{
        const ratio=pick([
          ['children','teachers','교원 1인당 원아 수'],
          ['children','kindergartens','유치원 1곳당 원아 수'],
          ['teachers','kindergartens','유치원 1곳당 교원 수']

  }
  function numericCell(q,r,key){

  function renderDataTable(q){

    }
    if(q.kind==='kindergarten'){

  function renderTableQuestion(q){

  // Basic categorical Venn practice is a distinct submode within the logic card.

  let diagramSvgCounter=0;

      <circle cx="103" cy="76" r="57" fill="none" stroke="#303c50" stroke-width="2"/>
      <circle cx="157" cy="76" r="57" fill="none" stroke="#303c50" stroke-width="2"/>
      <text x="82" y="54" fill="#202a3b" font-size="19" font-weight="750" text-anchor="middle">A</text>
      <text x="178" y="54" fill="#202a3b" font-size="19" font-weight="750" text-anchor="middle">B</text>
      ${cross}
    </svg>`;
  }
  function renderDiagramStudy(){
    tableCleanup();tableCleanup=()=>{};clearTimeout(pendingTimer);
    session=null;currentMode=null;question=null;studyMode='reason';
    app.innerHTML=`${topbar()}
      <div class="game-head"><button class="back-btn" id="study-back">← 훈련 선택</button><span class="game-caption">STUDY / NO TIMER</span></div>
      <div class="study-header"><div class="eyebrow">LOGIC / BASIC</div><h1>집합 다이어그램 암기</h1><p>명제의 표현에 따라 집합의 어느 영역이 비거나, 어느 영역에 대상이 존재하는지 익힙니다.</p></div>
      <div class="diagram-legend" aria-label="다이어그램 읽는 법"><span><span class="legend-square"></span> 회색 음영 = 반드시 비어 있는 영역</span><span><strong class="legend-x">×</strong> = 대상이 1개 이상 존재</span></div>
      <div class="diagram-study-callout">두 원이 겹쳐 그려진 것만으로 교집합에 원소가 있다는 뜻은 아닙니다. <strong>음영과 × 표시를 기준으로 판별하세요.</strong></div>
      <div class="study-toolbar"><button class="study-toggle selected" id="reveal-all">전체 보기</button><button class="study-toggle" id="hide-all">가리고 외우기</button><button class="primary-btn study-play" id="study-play">다이어그램 퀴즈 →</button></div>
      <div class="diagram-study-grid">${DIAGRAM_TYPES.map((t,i)=>`<button type="button" class="diagram-study-card" data-diagram-study="${i}" aria-pressed="true">
        <span class="diagram-study-statement">${escapeHtml(t.text)}</span>
        <span class="diagram-study-illustration">${diagramSvg(t)}<span class="diagram-masked-label">눌러서 확인</span></span>
        <span class="diagram-study-detail"><strong>${escapeHtml(t.relation)}</strong><small>${escapeHtml(t.explain)}</small></span>
      </button>`).join('')}</div>
      <div class="study-footnote">가리고 외우기를 누른 다음 각 문장을 보고 다이어그램을 떠올려보세요. 이 화면의 학습 시간과 정답률은 기록하지 않습니다.</div>`;
    bindTopbar();
    $('#study-back').addEventListener('click',exitGame);
    $('#study-play').addEventListener('click',()=>startGame('diagram'));
    const items=$$('[data-diagram-study]');
    const showAll=shown=>{
      items.forEach(el=>{el.classList.toggle('masked',!shown);el.classList.remove('revealed');el.setAttribute('aria-pressed',String(shown));});
      $('#reveal-all').classList.toggle('selected',shown);
      $('#hide-all').classList.toggle('selected',!shown);
    };
    $('#reveal-all').addEventListener('click',()=>showAll(true));
    $('#hide-all').addEventListener('click',()=>showAll(false));
    items.forEach(el=>el.addEventListener('click',()=>{
      if(el.classList.contains('masked')){el.classList.toggle('revealed');el.setAttribute('aria-pressed',String(el.classList.contains('revealed')));}
    }));
  }
  function makeDiagramQuestion({session,shuffle,pick}){
    let correct=pick(DIAGRAM_TYPES);
    if(correct.key===session.lastQuestionSignature)correct=pick(DIAGRAM_TYPES.filter(t=>t.key!==correct.key));
    session.lastQuestionSignature=correct.key;
    const distractors=shuffle(DIAGRAM_TYPES.filter(t=>t.key!==correct.key)).slice(0,3);
    const alternatives=shuffle([correct,...distractors]);
    return {statement:correct.text,correctKey:correct.key,correctIndex:alternatives.findIndex(t=>t.key===correct.key),
      alternatives, explanation:`${correct.relation} · ${correct.explain}`};
  }
  function renderDiagramQuestion(q){
    return `<section class="reason-paper diagram-quiz-paper" aria-label="집합 다이어그램 문제">
      <div class="reason-meta"><span>집합 · 명제 / 기본</span><span>다이어그램 선택</span></div>
      <p class="diagram-question-instruction">다음 명제를 나타내는 다이어그램을 고르세요.</p>
      <div class="diagram-statement">${escapeHtml(q.statement)}</div>
      <div class="diagram-legend quiz-legend"><span><span class="legend-square"></span> 회색 = 비어 있음</span><span><strong class="legend-x">×</strong> = 1개 이상 존재</span></div>
      <div class="diagram-option-grid">${q.alternatives.map((t,i)=>`<button type="button" class="diagram-option" data-diagram-choice="${i}" aria-label="${i+1}번 다이어그램"><span class="diagram-option-number">${REASON_NUMBER[i]}</span>${diagramSvg(t,{compact:true})}</button>`).join('')}</div>
      <div class="feedback reason-feedback" id="answer-feedback" aria-live="polite"></div>
      <p class="reason-hint">모든 A는 B라는 표현은 A의 존재를 보장하지 않습니다. 음영과 ×를 구별하세요.</p>
    </section>`;
  }
  function mountDiagramQuestion(q,{root,submit}){
    $$('.diagram-option',root).forEach(b=>b.addEventListener('click',()=>{
      const index=Number(b.dataset.diagramChoice);
      if(index!==q.correctIndex)$(`[data-diagram-choice="${q.correctIndex}"]`,root)?.classList.add('diagram-answer-reveal');
      submit(index,b);
    }));
  }
  registerMode({key:'diagram',hidden:true,title:'집합 다이어그램',subtitle:'명제에 맞는 음영과 × 표시를 고르는 기초 훈련',tag:'LOGIC / DIAGRAM',art:'◯',
    makeQuestion:makeDiagramQuestion,render:renderDiagramQuestion,mount:mountDiagramQuestion,
    checkAnswer(q,value){return {correct:Number(value)===q.correctIndex,explanation:q.explanation};}
  });

  // 5. Propositional/set reasoning. Each question is verified against all 4-element
  // finite interpretations of A, B, C (4096 cases) before its distractors are shown.
  // Important: universal claims do NOT imply existence; some(A,B) is symmetric,
  // while all(A,B) is NOT. This avoids accidental valid extra answers.
  const REASON_SYMBOLS=['A','B','C'];
  const REASON_NUMBER=['①','②','③','④'];
  const stmt=(kind,from,to)=>({kind,from,to});
  const ALL_CANDIDATES=[];
  for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(a!==b){
    for(const kind of ['all','none','some','someNot'])ALL_CANDIDATES.push(stmt(kind,a,b));
  }
  const REASON_PATTERNS=[
    {id:'chain', p:stmt('all',0,1), b:stmt('all',1,2), c:stmt('all',0,2), note:'A가 B에 포함되고 B가 C에 포함되므로, A도 C에 포함됩니다.'},
    {id:'exclusion',p:stmt('all',0,1),b:stmt('none',1,2),c:stmt('none',0,2),note:'A의 구성원은 모두 B에 속하고, B와 C는 서로 겹치지 않습니다.'},
    {id:'witness',p:stmt('some',0,1),b:stmt('all',1,2),c:stmt('some',0,2),note:'A이면서 B인 대상이 실제로 존재하고, 모든 B는 C이므로 그 대상은 C에도 속합니다.'},
    {id:'some-not',p:stmt('some',0,1),b:stmt('none',1,2),c:stmt('someNot',0,2),note:'A이면서 B인 대상이 존재하며, B인 대상은 어떤 것도 C가 아닙니다.'},
    {id:'shared',p:stmt('some',0,1),b:stmt('all',0,2),c:stmt('some',1,2),note:'A와 B에 함께 속하는 대상은 모두 A이므로 C에도 속합니다.'},
    {id:'reverse-witness',p:stmt('all',0,1),b:stmt('some',2,0),c:stmt('some',2,1),note:'C이면서 A인 대상이 존재합니다. 그 대상은 B이기도 합니다.'},
    {id:'not-b',p:stmt('none',0,1),b:stmt('some',0,2),c:stmt('someNot',2,1),note:'A이면서 C인 대상이 존재하고, A와 B는 서로 겹치지 않습니다.'},
    {id:'reverse-all',p:stmt('all',1,0),b:stmt('none',0,2),c:stmt('none',1,2),note:'B는 A의 일부이며, A는 C와 겹치지 않으므로 B도 C와 겹치지 않습니다.'},
    {id:'negative-witness',p:stmt('someNot',0,1),b:stmt('all',0,2),c:stmt('someNot',2,1),note:'A 중 B가 아닌 대상이 존재하며, 그 대상은 C에도 속합니다.'},
    {id:'not-overlap',p:stmt('some',1,2),b:stmt('none',0,1),c:stmt('someNot',2,0),note:'B와 C에 함께 속하는 대상이 존재하지만, B는 A와 겹치지 않습니다.'}
  ];
  function reasonText(r){
    const a=REASON_SYMBOLS[r.from],b=REASON_SYMBOLS[r.to];
    if(r.kind==='all')return `모든 ${a}는 ${b}이다.`;
    if(r.kind==='none')return `어떤 ${a}도 ${b}가 아니다.`;
    if(r.kind==='some')return `어떤 ${a}는 ${b}이다.`;
    return `어떤 ${a}는 ${b}가 아니다.`;
  }
  // Each element belongs to any combination of the three sets (0..7 bitmask).
  // Four elements are sufficient to validate all these deliberately bounded patterns.
  function holds(rule,world){
    const a=1<<rule.from,b=1<<rule.to;
    for(let i=0;i<4;i++){
      const mask=(world>>(i*3))&7;
      const yesA=Boolean(mask&a),yesB=Boolean(mask&b);
      if(rule.kind==='all' && yesA&&!yesB)return false;
      if(rule.kind==='none' && yesA&&yesB)return false;
      if(rule.kind==='some' && yesA&&yesB)return true;
      if(rule.kind==='someNot' && yesA&&!yesB)return true;
    }
    return rule.kind==='all'||rule.kind==='none';
  }
  function reasonEntails(premises,conclusion){
    let any=false;
    for(let w=0;w<4096;w++){
      if(!premises.every(p=>holds(p,w)))continue;
      any=true;
      if(!holds(conclusion,w))return false;
    }
    return any;
  }
  function reasonSatisfiable(premises){
    for(let w=0;w<4096;w++)if(premises.every(p=>holds(p,w)))return true;
    return false;
  }
  function remapStatement(rule,mapping){return stmt(rule.kind,mapping[rule.from],mapping[rule.to]);}
  function statementKey(r){return [r.kind,r.from,r.to].join(':');}
  function makeReasonQuestion({session,state,shuffle,pick}){
    const modeSetting=state.settings.reasoningStyle||'mixed';
    const task=modeSetting==='mixed'?pick(['conclusion','bridge']):modeSetting;
    let template=pick(REASON_PATTERNS);
    if(session.lastQuestionSignature===task+template.id){
      template=pick(REASON_PATTERNS.filter(p=>p.id!==template.id));
    }
    session.lastQuestionSignature=task+template.id;
    const map=shuffle([0,1,2]);
    const given=remapStatement(template.p,map);
    const bridge=remapStatement(template.b,map);
    const conclusion=remapStatement(template.c,map);
    const fullPremises=[given,bridge];
    const optionsPool=ALL_CANDIDATES.filter(v=>{
      const key=statementKey(v);
      if([given,bridge,conclusion].some(x=>statementKey(x)===key))return false;
      if(task==='conclusion'){
        return !reasonEntails(fullPremises,v);
      }
      return reasonSatisfiable([given,v])&&!reasonEntails([given,v],conclusion);
    });
    // The correct answer is proven, not merely assumed from the pattern name.
    const correct=task==='conclusion'?conclusion:bridge;
    const premises=task==='conclusion'?fullPremises:[given];
    if(!reasonSatisfiable(premises)||
      !(task==='conclusion'?reasonEntails(premises,correct):reasonEntails([given,correct],conclusion))||
      optionsPool.length<3){throw Error('Invalid logic question template: '+template.id);}
    // Distractors preferentially reuse the same pair or set involved in the answer.
    const ranked=shuffle(optionsPool).sort((a,b)=>{
      const score=r=>(r.from===correct.from?2:0)+(r.to===correct.to?2:0)+
        (r.from===correct.to?1:0)+(r.to===correct.from?1:0)+(r.kind===correct.kind?1:0);
      return score(b)-score(a);
    });
    const alternatives=shuffle([correct,...ranked.slice(0,3)]);
    const correctIndex=alternatives.findIndex(v=>statementKey(v)===statementKey(correct));
    return {task,premises,conclusion,alternatives,correctIndex,
      explanation:reasonText(correct)+' '+template.note,
      key:template.id};
  }
  function renderReasonQuestion(q){
    const isBridge=q.task==='bridge';
    const intro=isBridge?'주어진 명제와 선지를 함께 참이라고 할 때, 아래 결론이 반드시 성립하도록 하는 선지는?':'다음 명제들이 참일 때, 반드시 참인 선지는?';
    return `<section class="reason-paper" aria-label="집합 추론 문제">
      <div class="reason-meta"><span>집합 · 명제</span><span>${isBridge?'중간 다리':'참인 결론'}</span></div>
      <p class="reason-intro">${intro}</p>
      <div class="reason-premises">${q.premises.map((r,i)=>`<div class="reason-premise"><span class="reason-p-label">${isBridge?'주어진 명제':`명제 ${i+1}`}</span><span>${escapeHtml(reasonText(r))}</span></div>`).join('')}
      ${isBridge?`<div class="reason-connector" aria-hidden="true">＋ ?</div><div class="reason-premise reason-goal"><span class="reason-p-label">결론</span><span>${escapeHtml(reasonText(q.conclusion))}</span></div>`:''}</div>
      <div class="reason-choices">${q.alternatives.map((r,i)=>`<button class="reason-choice" type="button" data-logic-choice="${i}" aria-label="${i+1}번 ${escapeHtml(reasonText(r))}"><span class="reason-choice-number">${REASON_NUMBER[i]}</span><span>${escapeHtml(reasonText(r))}</span></button>`).join('')}</div>
      <div class="feedback reason-feedback" id="answer-feedback" aria-live="polite"></div>
      <p class="reason-hint">‘모든 A는 B’가 참이어도 A가 실제로 존재한다는 뜻은 아닙니다.</p>
    </section>`;
  }
  function mountReasonQuestion(q,{root,submit}){
    $$('.reason-choice',root).forEach(b=>b.addEventListener('click',()=>{
      const index=Number(b.dataset.logicChoice);
      if(index!==q.correctIndex){
        const right=$(`[data-logic-choice="${q.correctIndex}"]`,root);
        right?.classList.add('reason-answer-reveal');
      }
      submit(index,b);
    }));
  }
  registerMode({
    key:'reason',title:'집합 · 명제 추론',subtitle:'포함관계를 판별하고, 참인 결론 또는 중간 명제를 고르세요.',tag:'LOGIC / SETS',art:'A⊂B',
    makeQuestion:makeReasonQuestion,render:renderReasonQuestion,mount:mountReasonQuestion,
    checkAnswer(q,value){return {correct:Number(value)===q.correctIndex,explanation:q.explanation};}
  });

  // PWA works when the files are served through HTTPS or localhost; file:// still plays normally.
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  renderHome();
})();
</script>
